<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saelu | El lenguaje del cuidado real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --lavender:#c9b7e8;
    --mint:#a3e0c4;
    --blush:#f6bccb;
    --coral:#f0938c;
    --cream:#fffcf9;
    --ink:#332c3d;
    --ink-soft:#6b6275;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'Montserrat',sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- FONDO ---------- */
  .bg-wrap{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:
      radial-gradient(circle at 15% 20%, rgba(201,183,232,0.35), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(163,224,196,0.35), transparent 45%),
      radial-gradient(circle at 20% 85%, rgba(246,188,203,0.35), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(240,147,140,0.30), transparent 45%),
      var(--cream);
  }

  .blob{
    position:absolute;
    border-radius:42% 58% 65% 35% / 45% 40% 60% 55%;
    filter:blur(2px);
    opacity:0.55;
    animation:drift 22s ease-in-out infinite;
  }
  .blob.b1{width:220px;height:220px;background:var(--lavender);top:-40px;left:-60px;animation-delay:0s;}
  .blob.b2{width:180px;height:180px;background:var(--mint);top:10%;right:-50px;animation-delay:-4s;}
  .blob.b3{width:200px;height:200px;background:var(--blush);bottom:15%;left:-70px;animation-delay:-9s;}
  .blob.b4{width:240px;height:240px;background:var(--coral);bottom:-60px;right:-60px;animation-delay:-14s;opacity:0.4;}
  .blob.b5{width:130px;height:130px;background:var(--mint);top:45%;left:45%;opacity:0.25;animation-delay:-6s;}

  @keyframes drift{
    0%,100%{transform:translate(0,0) rotate(0deg) scale(1);}
    33%{transform:translate(18px,-22px) rotate(8deg) scale(1.05);}
    66%{transform:translate(-14px,16px) rotate(-6deg) scale(0.97);}
  }

  .sparkle{
    position:absolute;
    color:var(--coral);
    opacity:0.5;
    animation:twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.15;transform:scale(0.8) rotate(0deg);}
    50%{opacity:0.7;transform:scale(1.15) rotate(15deg);}
  }

  /* Floating skincare icons behind buttons */
  .product{
    position:absolute;
    opacity:0.5;
    animation:float-slow 9s ease-in-out infinite;
    filter:drop-shadow(0 4px 10px rgba(51,44,61,0.08));
  }
  @keyframes float-slow{
    0%,100%{transform:translateY(0) rotate(-3deg);}
    50%{transform:translateY(-22px) rotate(3deg);}
  }

  /* ---------- CONTENIDO ---------- */
  .page{
    position:relative;
    z-index:2;
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    padding:48px 24px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .logo-wrap{
    width:150px;
    height:150px;
    margin-bottom:6px;
    animation:appear 0.9s ease both;
  }
  .logo-wrap img{
    width:100%;
    height:100%;
    object-fit:contain;
    filter:drop-shadow(0 8px 18px rgba(201,183,232,0.35));
  }

  @keyframes appear{
    from{opacity:0;transform:translateY(-14px) scale(0.94);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }

  .wordmark{
    font-weight:600;
    font-size:2.1rem;
    letter-spacing:0.28em;
    margin-top:-8px;
    animation:appear 1s ease 0.1s both;
  }

  .tagline{
    font-weight:400;
    font-size:0.82rem;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    margin-top:4px;
    margin-bottom:34px;
    text-align:center;
    animation:appear 1s ease 0.2s both;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
    position:relative;
  }

  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 20px;
    border-radius:20px;
    text-decoration:none;
    color:var(--ink);
    font-weight:500;
    font-size:0.98rem;
    letter-spacing:0.01em;
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1.5px solid rgba(255,255,255,0.8);
    box-shadow:0 6px 18px rgba(51,44,61,0.06);
    overflow:hidden;
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1), box-shadow 0.35s ease, border-color 0.35s ease;
    animation:appear 0.7s ease both;
  }

  .link-btn::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.6) 45%, transparent 70%);
    transform:translateX(-120%);
    transition:transform 0.7s ease;
  }
  .link-btn:hover::before{transform:translateX(120%);}

  .link-btn:hover{
    transform:translateY(-4px) scale(1.015);
    box-shadow:0 14px 28px rgba(51,44,61,0.13);
  }

  .link-btn:active{transform:translateY(-1px) scale(0.99);}

  .icon-badge{
    flex:none;
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.15rem;
  }
  .icon-badge svg{width:22px;height:22px;}

  .link-text{display:flex;flex-direction:column;gap:1px;}
  .link-title{font-weight:600;font-size:0.98rem;}
  .link-sub{font-weight:400;font-size:0.72rem;color:var(--ink-soft);}

  .arrow{
    margin-left:auto;
    opacity:0.35;
    transition:transform 0.35s ease, opacity 0.35s ease;
  }
  .link-btn:hover .arrow{transform:translateX(4px);opacity:0.7;}

  /* WhatsApp - protagonista */
  .btn-whatsapp{
    background:linear-gradient(135deg, #f0938c, #f6bccb);
    border:1.5px solid rgba(255,255,255,0.65);
    color:#fff;
    box-shadow:0 10px 28px rgba(240,147,140,0.38);
    animation-delay:0.05s;
  }
  .btn-whatsapp .link-sub{color:rgba(255,255,255,0.85);}
  .btn-whatsapp .icon-badge{background:rgba(255,255,255,0.28);}
  .btn-whatsapp:hover{box-shadow:0 16px 34px rgba(240,147,140,0.5);}
  .btn-whatsapp .arrow{color:#fff;opacity:0.7;}
  .btn-whatsapp .icon-badge svg path,
  .btn-whatsapp .icon-badge svg circle{stroke:#fff;}

  .pulse-ring{
    position:absolute;
    inset:-3px;
    border-radius:22px;
    border:2px solid rgba(240,147,140,0.5);
    animation:pulse-ring 2.6s ease-out infinite;
    pointer-events:none;
  }
  @keyframes pulse-ring{
    0%{transform:scale(1);opacity:0.6;}
    100%{transform:scale(1.045);opacity:0;}
  }

  .btn-instagram .icon-badge{background:linear-gradient(135deg,#f6bccb,#c9b7e8);}
  .btn-tiktok .icon-badge{background:linear-gradient(135deg,#332c3d,#6b6275);}
  .btn-facebook .icon-badge{background:linear-gradient(135deg,#a3e0c4,#c9b7e8);}
  .btn-web .icon-badge{background:linear-gradient(135deg,#c9b7e8,#a3e0c4);}

  .link-btn:nth-child(1){animation-delay:0.05s;}
  .link-btn:nth-child(2){animation-delay:0.15s;}
  .link-btn:nth-child(3){animation-delay:0.25s;}
  .link-btn:nth-child(4){animation-delay:0.35s;}
  .link-btn:nth-child(5){animation-delay:0.45s;}

  .divider{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    margin:22px 0 8px;
    opacity:0.5;
  }
  .divider span{
    font-size:0.65rem;
    letter-spacing:0.15em;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--ink-soft), transparent);
  }

  footer{
    margin-top:auto;
    padding-top:34px;
    text-align:center;
    font-size:0.7rem;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    opacity:0.75;
  }

  footer .heart{color:var(--coral);}

  @media (prefers-reduced-motion: reduce){
    .blob,.sparkle,.product,.pulse-ring,.logo-wrap,.wordmark,.tagline,.link-btn{animation:none !important;}
  }

  .link-btn:focus-visible{
    outline:2.5px solid var(--ink);
    outline-offset:3px;
  }
</style>
</head>

    <rect x="21" y="12" width="18" height="26" rx="4" fill="#ffffff" opacity="0.7" stroke="#c9b7e8" stroke-width="1.5"/>

    <path d="M20 2 C30 20 34 30 20 46 C6 30 10 20 20 2 Z" fill="#f6bccb" opacity="0.5"/>
